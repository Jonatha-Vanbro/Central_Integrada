<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Central Integrada</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f4f8;
            overflow: hidden;
        }

        /* =========================
           LAYOUT PRINCIPAL
        ========================= */

        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* =========================
           MENU LATERAL
        ========================= */

        .sidebar {
            width: 280px;
            height: 100vh;
            background: #1b4079;
            color: white;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            box-shadow: 3px 0 10px rgba(0, 0, 0, 0.12);
            z-index: 10;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .brand-title {
            font-size: 19px;
            font-weight: 700;
            margin: 0;
        }

        .brand-subtitle {
            font-size: 11px;
            opacity: 0.75;
            margin-top: 2px;
        }

        /* =========================
           MENU
        ========================= */

        .menu-title {
            padding: 22px 20px 10px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
        }

        .menu {
            padding: 0 12px;
            overflow-y: auto;
        }

        .menu-item {
            width: 100%;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.82);
            padding: 13px 14px;
            margin-bottom: 5px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .menu-item i {
            font-size: 18px;
            width: 22px;
            text-align: center;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.10);
            color: white;
        }

        .menu-item.active {
            background: white;
            color: #1b4079;
            font-weight: 600;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
        }

        /* =========================
           RODAPÉ MENU
        ========================= */

        .sidebar-footer {
            margin-top: auto;
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 11px;
            opacity: 0.65;
            text-align: center;
        }

        /* =========================
           ÁREA PRINCIPAL
        ========================= */

        .main-content {
            flex: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* =========================
           TOPBAR
        ========================= */

        .topbar {
            height: 68px;
            background: white;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            flex-shrink: 0;
        }

        .current-system {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .current-icon {
            color: #1b4079;
            font-size: 20px;
        }

        .current-name {
            font-size: 16px;
            font-weight: 600;
            color: #263238;
        }

        .topbar-actions {
            display: flex;
            gap: 8px;
        }

        .topbar-btn {
            border: 1px solid #d9dee5;
            background: white;
            color: #495057;
            border-radius: 7px;
            padding: 7px 11px;
            cursor: pointer;
            transition: 0.2s;
        }

        .topbar-btn:hover {
            background: #f1f4f8;
            color: #1b4079;
        }

        /* =========================
           ÁREA DO IFRAME
        ========================= */

        .content-area {
            flex: 1;
            padding: 12px;
            min-height: 0;
        }

        .iframe-container {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
            position: relative;
        }

        #systemFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* =========================
           TELA INICIAL
        ========================= */

        .welcome-screen {
            position: absolute;
            inset: 0;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 2;
        }

        .welcome-content {
            max-width: 600px;
            padding: 30px;
        }

        .welcome-icon {
            width: 85px;
            height: 85px;
            margin: 0 auto 22px;
            border-radius: 20px;
            background: #1b4079;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            box-shadow: 0 8px 20px rgba(27, 64, 121, 0.25);
        }

        .welcome-content h1 {
            color: #1b4079;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .welcome-content p {
            color: #6c757d;
            font-size: 15px;
            margin: 0;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.90);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .loading.active {
            display: flex;
        }

        .loading-content {
            text-align: center;
            color: #1b4079;
        }

        .loading-content .spinner-border {
            width: 35px;
            height: 35px;
            margin-bottom: 12px;
        }

        .loading-content div {
            font-size: 13px;
        }

        /* =========================
           RESPONSIVIDADE
        ========================= */

        @media (max-width: 900px) {

            .sidebar {
                width: 230px;
            }

            .brand-title {
                font-size: 16px;
            }

            .menu-item {
                font-size: 13px;
            }
        }

        @media (max-width: 700px) {

            body {
                overflow: auto;
            }

            .app-container {
                height: auto;
                min-height: 100vh;
            }

            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                transition: left 0.3s ease;
                z-index: 1000;
            }

            .sidebar.open {
                left: 0;
            }

            .main-content {
                width: 100%;
                height: 100vh;
            }

            .mobile-menu-btn {
                display: block !important;
            }

            .current-name {
                font-size: 14px;
            }

            .topbar {
                padding: 0 12px;
            }

            .content-area {
                padding: 7px;
            }
        }

        .mobile-menu-btn {
            display: none;
            border: none;
            background: transparent;
            font-size: 22px;
            color: #1b4079;
            margin-right: 10px;
        }

    </style>

</head>

<body>

<div class="app-container">

    <!-- =====================================
         MENU LATERAL
    ====================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">

            <div class="brand">

                <div class="brand-icon">
                    <i class="bi bi-grid-1x2-fill"></i>
                </div>

                <div>

                    <div class="brand-title">
                        Central Integrada
                    </div>

                    <div class="brand-subtitle">
                        Sistemas e Ferramentas
                    </div>

                </div>

            </div>

        </div>


        <div class="menu-title">
            Sistemas
        </div>


        <div class="menu">

            <!-- =====================================
                 AGENDA DE TREINAMENTOS
            ====================================== -->

            <button
                class="menu-item"
                data-name="Agenda de Treinamentos"
                data-url="https://jonatha-vanbro.github.io/Agenda-de-Treinamentos/"
                data-icon="bi-mortarboard-fill"
                onclick="openSystem(this)"
            >

                <i class="bi bi-mortarboard-fill"></i>

                <span>
                    Agenda de Treinamentos
                </span>

            </button>


            <!-- =====================================
                 AGENDA DE TAREFAS - ENGENHARIA
            ====================================== -->

            <button
                class="menu-item"
                data-name="Agenda de Tarefas - Engenharia"
                data-url="https://jonatha-vanbro.github.io/Agenda-de-Tarefas-Engenharia-/"
                data-icon="bi-kanban-fill"
                onclick="openSystem(this)"
            >

                <i class="bi bi-kanban-fill"></i>

                <span>
                    Agenda de Tarefas - Engenharia
                </span>

            </button>


            <!-- =====================================
                 DASHBOARD DE QUALIDADE
            ====================================== -->

            <button
                class="menu-item"
                data-name="Dashboard de Qualidade"
                data-url="https://jonatha-vanbro.github.io/dashboard-qualidade/"
                data-icon="bi-bar-chart-fill"
                onclick="openSystem(this)"
            >

                <i class="bi bi-bar-chart-fill"></i>

                <span>
                    Dashboard de Qualidade
                </span>

            </button>


            <!-- =====================================
                 CONTROLE DE MATERIAIS - BOBINAGEM
            ====================================== -->

            <button
                class="menu-item"
                data-name="Controle de Materiais - Bobinagem"
                data-url="https://jonatha-vanbro.github.io/Controle-de-Materiais_Bobinagem/"
                data-icon="bi-box-seam-fill"
                onclick="openSystem(this)"
            >

                <i class="bi bi-box-seam-fill"></i>

                <span>
                    Controle de Materiais - Bobinagem
                </span>

            </button>


            <!-- =====================================
                 PROCEDIMENTOS DE TRABALHO
            ====================================== -->

            <button
                class="menu-item"
                data-name="Procedimentos de Trabalho"
                data-url="https://jonatha-vanbro.github.io/Procedimentos-de-Trabalho/"
                data-icon="bi-file-earmark-text-fill"
                onclick="openSystem(this)"
            >

                <i class="bi bi-file-earmark-text-fill"></i>

                <span>
                    Procedimentos de Trabalho
                </span>

            </button>

        </div>


        <!-- RODAPÉ -->

        <div class="sidebar-footer">

            Central Integrada<br>

            <span>
                Sistemas internos - Bombas Vanbro Ltda
            </span>

        </div>

    </aside>


    <!-- =====================================
         ÁREA PRINCIPAL
    ====================================== -->

    <main class="main-content">


        <!-- =====================================
             TOPBAR
        ====================================== -->

        <header class="topbar">

            <div class="current-system">

                <button
                    class="mobile-menu-btn"
                    onclick="toggleSidebar()"
                >

                    <i class="bi bi-list"></i>

                </button>

                <i
                    id="currentIcon"
                    class="bi bi-grid-1x2-fill current-icon"
                ></i>

                <span
                    id="currentName"
                    class="current-name"
                >
                    Central Integrada
                </span>

            </div>


            <div class="topbar-actions">

                <!-- Atualizar -->

                <button
                    class="topbar-btn"
                    title="Atualizar sistema"
                    onclick="reloadSystem()"
                >

                    <i class="bi bi-arrow-clockwise"></i>

                </button>


                <!-- Abrir nova aba -->

                <button
                    class="topbar-btn"
                    title="Abrir em nova aba"
                    onclick="openNewTab()"
                >

                    <i class="bi bi-box-arrow-up-right"></i>

                </button>

            </div>

        </header>


        <!-- =====================================
             ÁREA DE CONTEÚDO
        ====================================== -->

        <section class="content-area">

            <div class="iframe-container">


                <!-- =====================================
                     TELA INICIAL
                ====================================== -->

                <div
                    id="welcomeScreen"
                    class="welcome-screen"
                >

                    <div class="welcome-content">

                        <div class="welcome-icon">

                            <i class="bi bi-grid-1x2-fill"></i>

                        </div>


                        <h1>
                            Central Integrada
                        </h1>


                        <p>
                            Selecione uma ferramenta no menu lateral
                            para começar.
                        </p>

                    </div>

                </div>


                <!-- =====================================
                     LOADING
                ====================================== -->

                <div
                    id="loading"
                    class="loading"
                >

                    <div class="loading-content">

                        <div
                            class="spinner-border"
                            role="status"
                        ></div>

                        <div>
                            Carregando sistema...
                        </div>

                    </div>

                </div>


                <!-- =====================================
                     IFRAME
                ====================================== -->

                <iframe
                    id="systemFrame"
                    title="Sistema"
                    src="about:blank"
                ></iframe>

            </div>

        </section>

    </main>

</div>


<script>

    // =====================================
    // SISTEMA ATUALMENTE ABERTO
    // =====================================

    let currentUrl = "";


    // =====================================
    // ABRIR SISTEMA
    // =====================================

    function openSystem(button) {

        const url = button.dataset.url;
        const name = button.dataset.name;
        const icon = button.dataset.icon;


        // Verifica se existe URL

        if (!url) {

            alert(
                "O sistema \""
                + name
                + "\" ainda não possui um link configurado."
            );

            return;
        }


        // Guarda URL atual

        currentUrl = url;


        // Remove seleção dos outros menus

        document
            .querySelectorAll(".menu-item")
            .forEach(item => {

                item.classList.remove("active");

            });


        // Ativa item selecionado

        button.classList.add("active");


        // Atualiza nome

        document
            .getElementById("currentName")
            .textContent = name;


        // Atualiza ícone

        const currentIcon =
            document.getElementById("currentIcon");

        currentIcon.className =
            "bi "
            + icon
            + " current-icon";


        // Esconde tela inicial

        document
            .getElementById("welcomeScreen")
            .style.display = "none";


        // Mostra carregamento

        document
            .getElementById("loading")
            .classList.add("active");


        // Obtém iframe

        const frame =
            document.getElementById("systemFrame");


        // Carrega sistema

        frame.src = url;


        // Quando terminar de carregar

        frame.onload = function () {

            document
                .getElementById("loading")
                .classList.remove("active");

        };


        // Fecha menu em dispositivos móveis

        document
            .getElementById("sidebar")
            .classList.remove("open");

    }


    // =====================================
    // ATUALIZAR SISTEMA
    // =====================================

    function reloadSystem() {

        if (!currentUrl) {
            return;
        }


        const frame =
            document.getElementById("systemFrame");


        document
            .getElementById("loading")
            .classList.add("active");


        frame.src = currentUrl;

    }


    // =====================================
    // ABRIR EM NOVA ABA
    // =====================================

    function openNewTab() {

        if (!currentUrl) {

            alert(
                "Selecione um sistema primeiro."
            );

            return;
        }


        window.open(
            currentUrl,
            "_blank"
        );

    }


    // =====================================
    // MENU MOBILE
    // =====================================

    function toggleSidebar() {

        document
            .getElementById("sidebar")
            .classList.toggle("open");

    }


    // =====================================
    // FECHAR MENU AO CLICAR FORA
    // =====================================

    document.addEventListener(
        "click",
        function(event) {

            const sidebar =
                document.getElementById("sidebar");

            const menuButton =
                document.querySelector(".mobile-menu-btn");


            if (
                window.innerWidth <= 700 &&
                sidebar.classList.contains("open") &&
                !sidebar.contains(event.target) &&
                !menuButton.contains(event.target)
            ) {

                sidebar.classList.remove("open");

            }

        }
    );

</script>


</body>

</html>
```
