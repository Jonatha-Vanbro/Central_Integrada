<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Central Integrada</title>


    <!-- =====================================
         FAVICON
    ====================================== -->

    <link
        rel="icon"
        type="image/png"
        href="./favicon.png"
    >

    <link
        rel="shortcut icon"
        type="image/png"
        href="./favicon.png"
    >


    <!-- =====================================
         BOOTSTRAP
    ====================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================
         BOOTSTRAP ICONS
    ====================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f1f4f8;

            overflow: hidden;
        }


        /* =====================================
           LAYOUT PRINCIPAL
        ====================================== */

        .app-container {

            display: flex;

            width: 100vw;

            height: 100vh;
        }


        /* =====================================
           MENU LATERAL
        ====================================== */

        .sidebar {

            width: 280px;

            height: 100vh;

            background: #1b4079;

            color: white;

            display: flex;

            flex-direction: column;

            flex-shrink: 0;

            box-shadow:
                3px 0 10px rgba(0, 0, 0, 0.12);

            z-index: 10;
        }


        /* =====================================
           CABEÇALHO DO MENU
        ====================================== */

        .sidebar-header {

            padding: 18px 20px;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.15);
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        /* =====================================
           BOTÃO HOME
        ====================================== */

        .home-button {

            width: 45px;

            height: 45px;

            padding: 0;

            border: none;

            background:
                rgba(255, 255, 255, 0.15);

            color: white;

            border-radius: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;

            cursor: pointer;

            transition:
                all 0.2s ease;
        }


        .home-button:hover {

            background: white;

            color: #1b4079;

            transform: scale(1.04);
        }


        .home-button:active {

            transform: scale(0.98);
        }


        .brand-title {

            font-size: 19px;

            font-weight: 700;

            margin: 0;
        }


        .brand-subtitle {

            font-size: 11px;

            opacity: 0.75;

            margin-top: 2px;
        }


        /* =====================================
           TÍTULO DO MENU
        ====================================== */

        .menu-title {

            padding:
                22px 20px 10px;

            font-size: 11px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 1px;

            opacity: 0.6;
        }


        /* =====================================
           MENU
        ====================================== */

        .menu {

            padding: 0 12px;

            overflow-y: auto;
        }


        .menu-item {

            width: 100%;

            border: none;

            background: transparent;

            color:
                rgba(255, 255, 255, 0.82);

            padding: 13px 14px;

            margin-bottom: 5px;

            border-radius: 8px;

            display: flex;

            align-items: center;

            gap: 12px;

            text-align: left;

            cursor: pointer;

            transition:
                all 0.2s ease;

            font-size: 14px;
        }


        .menu-item i {

            font-size: 18px;

            width: 22px;

            text-align: center;

            flex-shrink: 0;
        }


        .menu-item:hover {

            background:
                rgba(255, 255, 255, 0.10);

            color: white;
        }


        .menu-item.active {

            background: white;

            color: #1b4079;

            font-weight: 600;

            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.12);
        }


        /* =====================================
           RODAPÉ DO MENU
        ====================================== */

        .sidebar-footer {

            margin-top: auto;

            padding: 16px 20px;

            border-top:
                1px solid rgba(255, 255, 255, 0.15);

            font-size: 11px;

            opacity: 0.65;

            text-align: center;
        }


        /* =====================================
           ÁREA PRINCIPAL
        ====================================== */

        .main-content {

            flex: 1;

            height: 100vh;

            display: flex;

            flex-direction: column;

            min-width: 0;
        }


        /* =====================================
           TOPBAR
        ====================================== */

        .topbar {

            height: 68px;

            background: white;

            border-bottom:
                1px solid #dee2e6;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 22px;

            flex-shrink: 0;
        }


        .current-system {

            display: flex;

            align-items: center;

            gap: 10px;

            min-width: 0;
        }


        .current-icon {

            color: #1b4079;

            font-size: 20px;

            flex-shrink: 0;
        }


        /* =====================================
           TÍTULO DA TOPBAR
        ====================================== */

        .current-info {

            display: flex;

            flex-direction: column;

            justify-content: center;

            min-width: 0;
        }


        .current-name {

            font-size: 16px;

            font-weight: 600;

            color: #263238;

            line-height: 1.2;
        }


        .current-description {

            display: none;

            font-size: 11px;

            color: #7a828a;

            margin-top: 3px;

            line-height: 1.2;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* =====================================
           DESCRIÇÃO DA PÁGINA INICIAL
        ====================================== */

        .home-mode .current-description {

            display: block;
        }


        .topbar-actions {

            display: flex;

            gap: 8px;

            flex-shrink: 0;
        }


        .topbar-btn {

            border:
                1px solid #d9dee5;

            background: white;

            color: #495057;

            border-radius: 7px;

            padding: 7px 11px;

            cursor: pointer;

            transition: 0.2s;
        }


        .topbar-btn:hover {

            background: #f1f4f8;

            color: #1b4079;
        }


        /* =====================================
           ÁREA DE CONTEÚDO
        ====================================== */

        .content-area {

            flex: 1;

            padding: 12px;

            min-height: 0;
        }


        .iframe-container {

            width: 100%;

            height: 100%;

            background: white;

            border-radius: 8px;

            overflow: hidden;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.07);

            position: relative;
        }


        #systemFrame {

            width: 100%;

            height: 100%;

            border: none;

            display: block;
        }


        /* =====================================
           TELA INICIAL
        ====================================== */

        .welcome-screen {

            position: absolute;

            inset: 0;

            background: white;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            overflow: hidden;

            z-index: 2;
        }


        /* =====================================
           LOGO COMO MARCA D'ÁGUA
        ====================================== */

        .welcome-logo {

            position: absolute;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            width: min(65%, 520px);

            max-height: 65%;

            object-fit: contain;

            opacity: 0.09;

            pointer-events: none;

            user-select: none;
        }


        /* =====================================
           CONTEÚDO DA TELA INICIAL

           Mantido vazio propositalmente.
           O logo funciona como elemento visual
           principal da página inicial.
        ====================================== */

        .welcome-content {

            position: relative;

            z-index: 2;

            pointer-events: none;
        }


        /* =====================================
           LOADING
        ====================================== */

        .loading {

            position: absolute;

            inset: 0;

            background:
                rgba(255, 255, 255, 0.90);

            display: none;

            align-items: center;

            justify-content: center;

            z-index: 5;
        }


        .loading.active {

            display: flex;
        }


        .loading-content {

            text-align: center;

            color: #1b4079;
        }


        .loading-content
        .spinner-border {

            width: 35px;

            height: 35px;

            margin-bottom: 12px;
        }


        .loading-content div {

            font-size: 13px;
        }


        /* =====================================
           BOTÃO MENU MOBILE
        ====================================== */

        .mobile-menu-btn {

            display: none;

            border: none;

            background: transparent;

            font-size: 22px;

            color: #1b4079;

            margin-right: 10px;
        }


        /* =====================================
           RESPONSIVIDADE
        ====================================== */

        @media (max-width: 900px) {

            .sidebar {

                width: 230px;
            }


            .brand-title {

                font-size: 16px;
            }


            .menu-item {

                font-size: 13px;
            }

        }


        @media (max-width: 700px) {

            body {

                overflow: auto;
            }


            .app-container {

                height: auto;

                min-height: 100vh;
            }


            .sidebar {

                position: fixed;

                left: -280px;

                top: 0;

                transition:
                    left 0.3s ease;

                z-index: 1000;
            }


            .sidebar.open {

                left: 0;
            }


            .main-content {

                width: 100%;

                height: 100vh;
            }


            .mobile-menu-btn {

                display: block;
            }


            .current-name {

                font-size: 14px;
            }


            .current-description {

                font-size: 10px;

                max-width: 230px;
            }


            .topbar {

                padding: 0 12px;
            }


            .content-area {

                padding: 7px;
            }


            .welcome-logo {

                width: 75%;

                opacity: 0.08;
            }

        }

    </style>

</head>


<body>


<div class="app-container">


    <!-- =====================================
         MENU LATERAL
    ====================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >


        <!-- =====================================
             CABEÇALHO / HOME
        ====================================== -->

        <div class="sidebar-header">

            <div class="brand">


                <!-- BOTÃO HOME -->

                <button
                    class="home-button"
                    title="Página inicial"
                    aria-label="Página inicial"
                    onclick="goHome()"
                >

                    <i class="bi bi-grid-1x2-fill"></i>

                </button>


                <div>

                    <div class="brand-title">
                        Central Integrada
                    </div>

                    <div class="brand-subtitle">
                        Sistemas e Ferramentas
                    </div>

                </div>

            </div>

        </div>


        <!-- =====================================
             TÍTULO
        ====================================== -->

        <div class="menu-title">
            Sistemas
        </div>


        <!-- =====================================
             MENU DE SISTEMAS
        ====================================== -->

        <div class="menu">


            <!-- =====================================
                 AGENDA DE TREINAMENTOS
            ====================================== -->

            <button
                class="menu-item"
                data-name="Agenda de Treinamentos"
                data-url="https://jonatha-vanbro.github.io/Agenda-de-Treinamentos/"
                data-icon="bi-mortarboard-fill"
                onclick="openSystem(this)"
            >

                <i class="bi bi-mortarboard-fill"></i>

                <span>
                    Agenda de Treinamentos
                </span>

            </button>


            <!-- =====================================
                 AGENDA DE TAREFAS - ENGENHARIA
            ====================================== -->

            <button
                class="menu-item"
                data-name="Agenda de Tarefas - Engenharia"
                data-url="https://jonatha-vanbro.github.io/Agenda-de-Tarefas-Engenharia-/"
                data-icon="bi-kanban-fill"
                onclick="openSystem(this)"
            >

                <i class="bi bi-kanban-fill"></i>

                <span>
                    Agenda de Tarefas - Engenharia
                </span>

            </button>


            <!-- =====================================
                 DASHBOARD DE QUALIDADE
            ====================================== -->

            <button
                class="menu-item"
                data-name="Dashboard de Qualidade"
                data-url="https://jonatha-vanbro.github.io/dashboard-qualidade/"
                data-icon="bi-bar-chart-fill"
                onclick="openSystem(this)"
            >

                <i class="bi bi-bar-chart-fill"></i>

                <span>
                    Dashboard de Qualidade
                </span>

            </button>


            <!-- =====================================
                 CONTROLE DE MATERIAIS - BOBINAGEM
            ====================================== -->

            <button
                class="menu-item"
                data-name="Controle de Materiais - Bobinagem"
                data-url="https://jonatha-vanbro.github.io/Controle-de-Materiais_Bobinagem/"
                data-icon="bi-box-seam-fill"
                onclick="openSystem(this)"
            >

                <i class="bi bi-box-seam-fill"></i>

                <span>
                    Controle de Materiais - Bobinagem
                </span>

            </button>


            <!-- =====================================
                 PROCEDIMENTOS DE TRABALHO
            ====================================== -->

            <button
                class="menu-item"
                data-name="Procedimentos de Trabalho"
                data-url="https://jonatha-vanbro.github.io/Procedimentos-de-Trabalho/"
                data-icon="bi-file-earmark-text-fill"
                onclick="openSystem(this)"
            >

                <i class="bi bi-file-earmark-text-fill"></i>

                <span>
                    Procedimentos de Trabalho
                </span>

            </button>


        </div>


        <!-- =====================================
             RODAPÉ
        ====================================== -->

        <div class="sidebar-footer">

            Central Integrada<br>

            <span>
                Sistemas Internos - Bombas Vanbro Ltda
            </span>

        </div>


    </aside>


    <!-- =====================================
         ÁREA PRINCIPAL
    ====================================== -->

    <main class="main-content">


        <!-- =====================================
             TOPBAR
        ====================================== -->

        <header class="topbar">


            <div
                class="current-system home-mode"
                id="currentSystem"
            >


                <!-- MENU MOBILE -->

                <button
                    class="mobile-menu-btn"
                    onclick="toggleSidebar()"
                >

                    <i class="bi bi-list"></i>

                </button>


                <!-- ÍCONE -->

                <i
                    id="currentIcon"
                    class="bi bi-grid-1x2-fill current-icon"
                ></i>


                <!-- INFORMAÇÕES -->

                <div class="current-info">


                    <span
                        id="currentName"
                        class="current-name"
                    >
                        Central Integrada
                    </span>


                    <span
                        id="currentDescription"
                        class="current-description"
                    >
                        Selecione uma ferramenta no menu lateral para começar
                    </span>


                </div>


            </div>


            <!-- =====================================
                 BOTÕES DA TOPBAR
            ====================================== -->

            <div class="topbar-actions">


                <!-- ATUALIZAR -->

                <button
                    class="topbar-btn"
                    title="Atualizar sistema"
                    onclick="reloadSystem()"
                >

                    <i class="bi bi-arrow-clockwise"></i>

                </button>


                <!-- NOVA ABA -->

                <button
                    class="topbar-btn"
                    title="Abrir em nova aba"
                    onclick="openNewTab()"
                >

                    <i class="bi bi-box-arrow-up-right"></i>

                </button>


            </div>


        </header>


        <!-- =====================================
             ÁREA DO SISTEMA
        ====================================== -->

        <section class="content-area">


            <div class="iframe-container">


                <!-- =====================================
                     TELA INICIAL
                ====================================== -->

                <div
                    id="welcomeScreen"
                    class="welcome-screen"
                >


                    <!-- LOGO DA EMPRESA
                         COMO MARCA D'ÁGUA -->

                    <img
                        src="./logo.png"
                        alt="Logo da empresa"
                        class="welcome-logo"
                    >


                    <!--
                        Não há texto aqui.
                        A página inicial utiliza
                        somente o logo como marca d'água.
                    -->

                    <div class="welcome-content"></div>


                </div>


                <!-- =====================================
                     LOADING
                ====================================== -->

                <div
                    id="loading"
                    class="loading"
                >


                    <div class="loading-content">


                        <div
                            class="spinner-border"
                            role="status"
                        ></div>


                        <div>
                            Carregando sistema...
                        </div>


                    </div>


                </div>


                <!-- =====================================
                     IFRAME
                ====================================== -->

                <iframe
                    id="systemFrame"
                    title="Sistema"
                    src="about:blank"
                ></iframe>


            </div>


        </section>


    </main>


</div>



<script>


    /* =====================================
       SISTEMA ATUAL
    ====================================== */

    let currentUrl = "";


    /* =====================================
       ABRIR SISTEMA
    ====================================== */

    function openSystem(button) {


        const url =
            button.dataset.url;

        const name =
            button.dataset.name;

        const icon =
            button.dataset.icon;


        /* ---------------------------------
           VERIFICA URL
        --------------------------------- */

        if (!url) {

            alert(
                "O sistema \""
                + name
                + "\" ainda não possui um link configurado."
            );

            return;
        }


        /* ---------------------------------
           GUARDA URL
        --------------------------------- */

        currentUrl = url;


        /* ---------------------------------
           REMOVE SELEÇÃO ANTERIOR
        --------------------------------- */

        document
            .querySelectorAll(".menu-item")
            .forEach(item => {

                item.classList.remove("active");

            });


        /* ---------------------------------
           ATIVA SISTEMA
        --------------------------------- */

        button.classList.add("active");


        /* ---------------------------------
           ATUALIZA NOME
        --------------------------------- */

        document
            .getElementById("currentName")
            .textContent = name;


        /* ---------------------------------
           ESCONDE DESCRIÇÃO DA HOME
        --------------------------------- */

        document
            .getElementById("currentSystem")
            .classList.remove("home-mode");


        /* ---------------------------------
           ATUALIZA ÍCONE
        --------------------------------- */

        const currentIcon =
            document.getElementById("currentIcon");


        currentIcon.className =
            "bi "
            + icon
            + " current-icon";


        /* ---------------------------------
           ESCONDE TELA INICIAL
        --------------------------------- */

        document
            .getElementById("welcomeScreen")
            .style.display = "none";


        /* ---------------------------------
           MOSTRA LOADING
        --------------------------------- */

        document
            .getElementById("loading")
            .classList.add("active");


        /* ---------------------------------
           CARREGA IFRAME
        --------------------------------- */

        const frame =
            document.getElementById("systemFrame");


        frame.src = url;


        /* ---------------------------------
           REMOVE LOADING
        --------------------------------- */

        frame.onload = function() {

            document
                .getElementById("loading")
                .classList.remove("active");

        };


        /* ---------------------------------
           FECHA MENU MOBILE
        --------------------------------- */

        document
            .getElementById("sidebar")
            .classList.remove("open");

    }



    /* =====================================
       VOLTAR PARA A PÁGINA INICIAL
    ====================================== */

    function goHome() {


        /* ---------------------------------
           LIMPA URL ATUAL
        --------------------------------- */

        currentUrl = "";


        /* ---------------------------------
           REMOVE SELEÇÃO DOS SISTEMAS
        --------------------------------- */

        document
            .querySelectorAll(".menu-item")
            .forEach(item => {

                item.classList.remove("active");

            });


        /* ---------------------------------
           ATUALIZA NOME
        --------------------------------- */

        document
            .getElementById("currentName")
            .textContent = "Central Integrada";


        /* ---------------------------------
           MOSTRA DESCRIÇÃO
        --------------------------------- */

        document
            .getElementById("currentSystem")
            .classList.add("home-mode");


        /* ---------------------------------
           RESTAURA ÍCONE
        --------------------------------- */

        document
            .getElementById("currentIcon")
            .className =
                "bi bi-grid-1x2-fill current-icon";


        /* ---------------------------------
           LIMPA IFRAME
        --------------------------------- */

        document
            .getElementById("systemFrame")
            .src = "about:blank";


        /* ---------------------------------
           MOSTRA TELA INICIAL
        --------------------------------- */

        document
            .getElementById("welcomeScreen")
            .style.display = "flex";


        /* ---------------------------------
           ESCONDE LOADING
        --------------------------------- */

        document
            .getElementById("loading")
            .classList.remove("active");


        /* ---------------------------------
           FECHA MENU MOBILE
        --------------------------------- */

        document
            .getElementById("sidebar")
            .classList.remove("open");

    }



    /* =====================================
       ATUALIZAR SISTEMA
    ====================================== */

    function reloadSystem() {


        if (!currentUrl) {

            return;

        }


        const frame =
            document.getElementById("systemFrame");


        document
            .getElementById("loading")
            .classList.add("active");


        frame.src = currentUrl;

    }



    /* =====================================
       ABRIR EM NOVA ABA
    ====================================== */

    function openNewTab() {


        if (!currentUrl) {

            alert(
                "Selecione um sistema primeiro."
            );

            return;

        }


        window.open(
            currentUrl,
            "_blank"
        );

    }



    /* =====================================
       MENU MOBILE
    ====================================== */

    function toggleSidebar() {


        document
            .getElementById("sidebar")
            .classList.toggle("open");

    }



    /* =====================================
       FECHAR MENU AO CLICAR FORA
    ====================================== */

    document.addEventListener(
        "click",
        function(event) {


            const sidebar =
                document.getElementById("sidebar");


            const menuButton =
                document.querySelector(".mobile-menu-btn");


            if (

                window.innerWidth <= 700 &&

                sidebar.classList.contains("open") &&

                !sidebar.contains(event.target) &&

                !menuButton.contains(event.target)

            ) {

                sidebar.classList.remove("open");

            }

        }
    );


</script>


</body>

</html>
