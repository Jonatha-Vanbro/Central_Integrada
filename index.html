<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Central Integrada</title>

    <link rel="icon"
          type="image/png"
          href="./favicon.png">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f4f8;
            overflow: hidden;
        }


        /* =========================================================
           SIDEBAR
        ========================================================= */

        .sidebar {

            position: fixed;

            top: 0;
            left: 0;

            width: 302px;
            height: 100vh;

            background: #1e2a4a;
            color: #fff;

            display: flex;
            flex-direction: column;

            z-index: 1000;

            transition:
                width .25s ease,
                left .25s ease;

            overflow: hidden;
        }


        .sidebar.collapsed {
            width: 76px;
        }


        /* =========================================================
           SIDEBAR HEADER
        ========================================================= */

        .sidebar-header {

            height: 82px;

            padding: 0 18px;

            display: flex;
            align-items: center;

            border-bottom:
                1px solid rgba(255,255,255,.10);

            flex-shrink: 0;
        }


        .home-button {

            width: 42px;
            height: 42px;

            border: none;
            border-radius: 10px;

            background: #1b4079;
            color: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;

            cursor: pointer;

            flex-shrink: 0;

            transition:
                background .2s ease,
                transform .2s ease;
        }


        .home-button:hover {

            background: #285895;

            transform: translateY(-1px);
        }


        .sidebar-title {

            margin-left: 12px;

            min-width: 0;

            flex: 1;
        }


        .sidebar-title h1 {

            margin: 0;

            font-size: 18px;
            font-weight: 700;

            line-height: 1.2;

            white-space: nowrap;
        }


        .sidebar-title span {

            display: block;

            margin-top: 3px;

            font-size: 11px;

            color: #aebbd4;

            white-space: nowrap;
        }


        .collapse-button {

            width: 32px;
            height: 32px;

            border: none;
            border-radius: 7px;

            background: transparent;
            color: #c8d2e5;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-size: 18px;

            flex-shrink: 0;
        }


        .collapse-button:hover {

            background: rgba(255,255,255,.08);
            color: #fff;
        }


        /* =========================================================
           MENU
        ========================================================= */

        .menu {

            flex: 1;

            padding: 18px 12px;

            overflow-y: auto;
            overflow-x: hidden;
        }


        .menu::-webkit-scrollbar {
            width: 6px;
        }


        .menu::-webkit-scrollbar-track {
            background: transparent;
        }


        .menu::-webkit-scrollbar-thumb {

            background:
                rgba(255,255,255,.15);

            border-radius: 10px;
        }


        .menu-title {

            padding: 0 12px 10px;

            font-size: 11px;

            font-weight: 700;

            color: #8f9db9;

            text-transform: uppercase;

            letter-spacing: .08em;

            white-space: nowrap;
        }


        .menu-item {

            width: 100%;

            min-height: 48px;

            margin-bottom: 5px;

            padding: 0 12px;

            border: none;
            border-radius: 9px;

            background: transparent;

            color: #dce4f2;

            display: flex;
            align-items: center;

            text-align: left;

            cursor: pointer;

            transition:
                background .2s ease,
                color .2s ease;
        }


        .menu-item i {

            width: 26px;

            margin-right: 10px;

            font-size: 18px;

            text-align: center;

            flex-shrink: 0;
        }


        .menu-item span {

            font-size: 13px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .menu-item:hover {

            background: rgba(255,255,255,.08);
            color: #fff;
        }


        .menu-item.active {

            background: #1b4079;
            color: #fff;

            box-shadow:
                inset 3px 0 0 #72a7e8;
        }


        /* =========================================================
           SIDEBAR COLLAPSED
        ========================================================= */

        .sidebar.collapsed .sidebar-title,
        .sidebar.collapsed .collapse-button,
        .sidebar.collapsed .menu-title,
        .sidebar.collapsed .menu-item span {

            display: none;
        }


        .sidebar.collapsed .sidebar-header {

            padding: 0;

            justify-content: center;
        }


        .sidebar.collapsed .menu {

            padding:
                18px 10px;
        }


        .sidebar.collapsed .menu-item {

            justify-content: center;

            padding: 0;
        }


        .sidebar.collapsed .menu-item i {

            margin: 0;
        }


        /* =========================================================
           SIDEBAR FOOTER
        ========================================================= */

        .sidebar-footer {

            padding: 15px 18px;

            border-top:
                1px solid rgba(255,255,255,.10);

            color: #8f9db9;

            font-size: 10px;

            line-height: 1.5;

            flex-shrink: 0;

            white-space: nowrap;
        }


        .sidebar.collapsed .sidebar-footer {

            display: none;
        }


        /* =========================================================
           MAIN
        ========================================================= */

        .main {

            position: fixed;

            top: 0;
            right: 0;
            bottom: 0;
            left: 302px;

            display: flex;
            flex-direction: column;

            transition:
                left .25s ease;
        }


        .sidebar.collapsed ~ .main {

            left: 76px;
        }


        /* =========================================================
           TOPBAR
        ========================================================= */

        .topbar {

            height: 64px;

            background: #fff;

            border-bottom:
                1px solid #dce2ea;

            display: flex;
            align-items: center;

            padding:
                0 20px;

            flex-shrink: 0;

            box-shadow:
                0 1px 3px rgba(0,0,0,.04);

            z-index: 20;
        }


        .mobile-menu-button {

            display: none;

            width: 38px;
            height: 38px;

            margin-right: 12px;

            border: none;
            border-radius: 8px;

            background: #1e2a4a;
            color: #fff;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-size: 19px;
        }


        .current-system {

            flex: 1;

            min-width: 0;

            display: flex;
            align-items: center;

            gap: 10px;
        }


        .current-system-icon {

            width: 36px;
            height: 36px;

            border-radius: 8px;

            background: #eaf0f8;

            color: #1b4079;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;

            flex-shrink: 0;
        }


        .current-system-name {

            font-size: 15px;

            font-weight: 600;

            color: #27344d;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .topbar-actions {

            display: flex;

            align-items: center;

            gap: 7px;
        }


        .topbar-button {

            width: 36px;
            height: 36px;

            border: 1px solid #d9e0e9;

            border-radius: 8px;

            background: #fff;

            color: #53627a;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-size: 17px;

            transition:
                background .2s ease,
                color .2s ease,
                border-color .2s ease;
        }


        .topbar-button:hover {

            background: #1e2a4a;
            border-color: #1e2a4a;

            color: #fff;
        }


        /* =========================================================
           CONTENT
        ========================================================= */

        .content {

            position: relative;

            flex: 1;

            min-height: 0;

            padding: 20px;

            overflow: hidden;
        }


        .iframe-container {

            position: relative;

            width: 100%;
            height: 100%;

            background: #fff;

            border-radius: 10px;

            overflow: hidden;

            box-shadow:
                0 2px 8px rgba(20,35,60,.08);
        }


        #systemFrame {

            width: 100%;
            height: 100%;

            border: none;

            display: none;

            background: #fff;
        }


        /* =========================================================
           WELCOME
        ========================================================= */

        .welcome {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #fff;

            overflow: hidden;
        }


        .welcome::before {

            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(30,42,74,.06),
                    transparent 70%
                );

            pointer-events: none;
        }


        .welcome-content {

            position: relative;

            z-index: 2;

            text-align: center;

            max-width: 600px;

            padding: 30px;
        }


        .welcome-logo {

            width: 180px;

            max-width: 60vw;

            margin-bottom: 25px;

            opacity: .95;
        }


        .welcome-title {

            margin: 0;

            color: #1e2a4a;

            font-size: 28px;

            font-weight: 700;
        }


        .welcome-text {

            margin-top: 10px;

            color: #718096;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =========================================================
           LOADING
        ========================================================= */

        .loading {

            position: absolute;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            background:
                rgba(255,255,255,.88);

            z-index: 10;
        }


        .loading-content {

            text-align: center;

            color: #1e2a4a;
        }


        .loading-spinner {

            width: 36px;
            height: 36px;

            margin: 0 auto 12px;

            border:
                3px solid #dbe3ef;

            border-top-color:
                #1b4079;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;
        }


        .loading-text {

            font-size: 13px;

            color: #65748b;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }
        }


        /* =========================================================
           MOBILE OVERLAY
        ========================================================= */

        .sidebar-overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.45);

            z-index: 999;

            display: none;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 900px) {

            .sidebar {

                width: 280px;

                left: -280px;

                box-shadow:
                    5px 0 20px rgba(0,0,0,.15);
            }


            .sidebar.mobile-open {

                left: 0;
            }


            .sidebar.collapsed {

                width: 280px;
            }


            .sidebar.collapsed .sidebar-title,
            .sidebar.collapsed .collapse-button,
            .sidebar.collapsed .menu-title,
            .sidebar.collapsed .menu-item span {

                display: block;
            }


            .sidebar.collapsed .sidebar-header {

                padding: 0 18px;

                justify-content: initial;
            }


            .sidebar.collapsed .menu {

                padding: 18px 12px;
            }


            .sidebar.collapsed .menu-item {

                justify-content: initial;

                padding: 0 12px;
            }


            .sidebar.collapsed .menu-item i {

                margin-right: 10px;
            }


            .sidebar.collapsed .sidebar-footer {

                display: block;
            }


            .main,
            .sidebar.collapsed ~ .main {

                left: 0;
            }


            .mobile-menu-button {

                display: flex;
            }


            .sidebar-overlay.active {

                display: block;
            }
        }


        @media (max-width: 576px) {

            .topbar {

                height: 58px;

                padding: 0 12px;
            }


            .content {

                padding: 10px;
            }


            .current-system-name {

                font-size: 13px;
            }


            .current-system-icon {

                width: 32px;
                height: 32px;

                font-size: 16px;
            }


            .topbar-button {

                width: 34px;
                height: 34px;
            }


            .welcome-title {

                font-size: 23px;
            }


            .welcome-text {

                font-size: 13px;
            }


            .welcome-logo {

                width: 150px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================================
         SIDEBAR
    ========================================================== -->

    <aside
        id="sidebar"
        class="sidebar"
    >

        <div class="sidebar-header">

            <button
                class="home-button"
                onclick="goHome()"
                title="Página inicial"
            >

                <i class="bi bi-house-fill"></i>

            </button>


            <div class="sidebar-title">

                <h1>
                    Central Integrada
                </h1>

                <span>
                    Sistemas e Ferramentas
                </span>

            </div>


            <button
                class="collapse-button"
                onclick="toggleSidebarCollapse()"
                title="Recolher menu"
            >

                <i
                    id="collapseIcon"
                    class="bi bi-chevron-left"
                ></i>

            </button>

        </div>


        <div class="menu">

            <div class="menu-title">
                Sistemas
            </div>


            <!-- =================================================
                 1 - AGENDA DE TREINAMENTOS
            ================================================== -->

            <button
                class="menu-item"
                data-name="Agenda de Treinamentos"
                data-url="https://jonatha-vanbro.github.io/Agenda-de-Treinamentos/"
                data-icon="bi-mortarboard-fill"
                onclick="openSystem(this)"
                title="Agenda de Treinamentos"
            >

                <i class="bi bi-mortarboard-fill"></i>

                <span>
                    Agenda de Treinamentos
                </span>

            </button>


            <!-- =================================================
                 2 - AGENDA DE TAREFAS - ENGENHARIA
            ================================================== -->

            <button
                class="menu-item"
                data-name="Agenda de Tarefas - Engenharia"
                data-url="https://jonatha-vanbro.github.io/Agenda-de-Tarefas-Engenharia-/"
                data-icon="bi-kanban-fill"
                onclick="openSystem(this)"
                title="Agenda de Tarefas - Engenharia"
            >

                <i class="bi bi-kanban-fill"></i>

                <span>
                    Agenda de Tarefas - Engenharia
                </span>

            </button>


            <!-- =================================================
                 3 - DASHBOARD DE QUALIDADE
            ================================================== -->

            <button
                class="menu-item"
                data-name="Dashboard de Qualidade"
                data-url="https://jonatha-vanbro.github.io/dashboard-qualidade/"
                data-icon="bi-bar-chart-fill"
                onclick="openSystem(this)"
                title="Dashboard de Qualidade"
            >

                <i class="bi bi-bar-chart-fill"></i>

                <span>
                    Dashboard de Qualidade
                </span>

            </button>


            <!-- =================================================
                 4 - CONTROLE DE MATERIAIS - BOBINAGEM
            ================================================== -->

            <button
                class="menu-item"
                data-name="Controle de Materiais - Bobinagem"
                data-url="https://jonatha-vanbro.github.io/Controle-de-Materiais_Bobinagem/"
                data-icon="bi-box-seam-fill"
                onclick="openSystem(this)"
                title="Controle de Materiais - Bobinagem"
            >

                <i class="bi bi-box-seam-fill"></i>

                <span>
                    Controle de Materiais - Bobinagem
                </span>

            </button>


            <!-- =================================================
                 5 - PROCEDIMENTOS DE TRABALHO
            ================================================== -->

            <button
                class="menu-item"
                data-name="Procedimentos de Trabalho"
                data-url="https://jonatha-vanbro.github.io/Procedimentos-de-Trabalho/"
                data-icon="bi-file-earmark-text-fill"
                onclick="openSystem(this)"
                title="Procedimentos de Trabalho"
            >

                <i class="bi bi-file-earmark-text-fill"></i>

                <span>
                    Procedimentos de Trabalho
                </span>

            </button>


            <!-- =================================================
                 6 - CONTRATOS E LICITAÇÕES
            ================================================== -->

            <button
                class="menu-item"
                data-name="Contratos e Licitações"
                data-url="https://jonatha-vanbro.github.io/Controle-de-Contratos-e-Licita-es-/"
                data-icon="bi-briefcase-fill"
                onclick="openSystem(this)"
                title="Contratos e Licitações"
            >

                <i class="bi bi-briefcase-fill"></i>

                <span>
                    Contratos e Licitações
                </span>

            </button>


            <!-- =================================================
                 7 - CONTROLE DE PEDIDOS - AEGEA
            ================================================== -->

            <button
                class="menu-item"
                data-name="Controle de Pedidos - AEGEA"
                data-url="https://jonatha-vanbro.github.io/Controle-de-Pedidos---AEGEA/"
                data-icon="bi-truck"
                onclick="openSystem(this)"
                title="Controle de Pedidos - AEGEA"
            >

                <i class="bi bi-truck"></i>

                <span>
                    Controle de Pedidos - AEGEA
                </span>

            </button>

        </div>


        <!-- =====================================================
             FOOTER
        ====================================================== -->

        <div class="sidebar-footer">

            Central Integrada<br>

            Sistemas Internos - Bombas Vanbro Ltda

        </div>

    </aside>


    <!-- =========================================================
         OVERLAY MOBILE
    ========================================================== -->

    <div
        id="sidebarOverlay"
        class="sidebar-overlay"
        onclick="toggleSidebar()"
    ></div>


    <!-- =========================================================
         MAIN
    ========================================================== -->

    <main class="main">


        <!-- =====================================================
             TOPBAR
        ====================================================== -->

        <header class="topbar">


            <button
                class="mobile-menu-button"
                onclick="toggleSidebar()"
                title="Abrir menu"
            >

                <i class="bi bi-list"></i>

            </button>


            <div class="current-system">


                <div
                    class="current-system-icon"
                    id="currentSystemIcon"
                >

                    <i class="bi bi-house-fill"></i>

                </div>


                <div
                    class="current-system-name"
                    id="currentSystemName"
                >

                    Central Integrada

                </div>

            </div>


            <div class="topbar-actions">


                <button
                    class="topbar-button"
                    onclick="reloadSystem()"
                    title="Atualizar sistema"
                >

                    <i class="bi bi-arrow-clockwise"></i>

                </button>


                <button
                    class="topbar-button"
                    onclick="openNewTab()"
                    title="Abrir em nova aba"
                >

                    <i class="bi bi-box-arrow-up-right"></i>

                </button>

            </div>

        </header>


        <!-- =====================================================
             CONTENT
        ====================================================== -->

        <section class="content">


            <div class="iframe-container">


                <!-- =================================================
                     WELCOME
                ================================================== -->

                <div
                    id="welcome"
                    class="welcome"
                >

                    <div class="welcome-content">


                        <img
                            src="./logo.png"
                            alt="Bombas Vanbro"
                            class="welcome-logo"
                        >


                        <h2 class="welcome-title">

                            Central Integrada

                        </h2>


                        <p class="welcome-text">

                            Selecione um sistema no menu lateral
                            para acessar as ferramentas da
                            Bombas Vanbro.

                        </p>

                    </div>

                </div>


                <!-- =================================================
                     IFRAME
                ================================================== -->

                <iframe
                    id="systemFrame"
                    title="Sistema"
                    allow="fullscreen"
                ></iframe>


                <!-- =================================================
                     LOADING
                ================================================== -->

                <div
                    id="loading"
                    class="loading"
                >

                    <div class="loading-content">


                        <div class="loading-spinner"></div>


                        <div class="loading-text">

                            Carregando sistema...

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script>


        let currentUrl = "";


        /* =========================================================
           CONTROLE DE CACHE
        ========================================================= */

        function comVersao(url) {

            const separador =
                url.includes("?")
                    ? "&"
                    : "?";

            return `${url}${separador}v=${Date.now()}`;
        }


        /* =========================================================
           ABRIR SISTEMA
        ========================================================== */

        function openSystem(button) {

            const url =
                button.dataset.url;

            const name =
                button.dataset.name;

            const icon =
                button.dataset.icon;


            if (!url) {
                return;
            }


            currentUrl = url;


            /* -----------------------------------------
               MENU ATIVO
            ----------------------------------------- */

            document
                .querySelectorAll(".menu-item")
                .forEach(item => {

                    item.classList.remove("active");

                });


            button.classList.add("active");


            /* -----------------------------------------
               ATUALIZA TOPBAR
            ----------------------------------------- */

            document
                .getElementById("currentSystemName")
                .textContent = name;


            document
                .getElementById("currentSystemIcon")
                .innerHTML =
                    `<i class="bi ${icon}"></i>`;


            /* -----------------------------------------
               ELEMENTOS
            ----------------------------------------- */

            const welcome =
                document.getElementById("welcome");

            const frame =
                document.getElementById("systemFrame");

            const loading =
                document.getElementById("loading");


            /* -----------------------------------------
               MOSTRA LOADING
            ----------------------------------------- */

            welcome.style.display = "none";

            loading.style.display = "flex";

            frame.style.display = "none";


            /* -----------------------------------------
               CARREGA IFRAME
            ----------------------------------------- */

            frame.onload = function () {

                loading.style.display = "none";

                frame.style.display = "block";

            };


            frame.src =
                comVersao(url);


            /* -----------------------------------------
               FECHA SIDEBAR NO MOBILE
            ----------------------------------------- */

            closeMobileSidebar();

        }


        /* =========================================================
           VOLTAR PARA HOME
        ========================================================== */

        function goHome() {

            currentUrl = "";


            document
                .querySelectorAll(".menu-item")
                .forEach(item => {

                    item.classList.remove("active");

                });


            document
                .getElementById("currentSystemName")
                .textContent =
                    "Central Integrada";


            document
                .getElementById("currentSystemIcon")
                .innerHTML =
                    `<i class="bi bi-house-fill"></i>`;


            const welcome =
                document.getElementById("welcome");

            const frame =
                document.getElementById("systemFrame");

            const loading =
                document.getElementById("loading");


            frame.src = "about:blank";

            frame.style.display = "none";

            loading.style.display = "none";

            welcome.style.display = "flex";


            closeMobileSidebar();

        }


        /* =========================================================
           RECOLHER / EXPANDIR SIDEBAR
        ========================================================== */

        function toggleSidebarCollapse() {

            const sidebar =
                document.getElementById("sidebar");

            const icon =
                document.getElementById("collapseIcon");


            sidebar.classList.toggle("collapsed");


            if (
                sidebar.classList.contains("collapsed")
            ) {

                icon.className =
                    "bi bi-chevron-right";

            } else {

                icon.className =
                    "bi bi-chevron-left";

            }

        }


        /* =========================================================
           RECARREGAR SISTEMA
        ========================================================== */

        function reloadSystem() {

            if (!currentUrl) {
                return;
            }


            const frame =
                document.getElementById("systemFrame");

            const loading =
                document.getElementById("loading");


            loading.style.display = "flex";


            frame.style.display = "none";


            frame.onload = function () {

                loading.style.display = "none";

                frame.style.display = "block";

            };


            frame.src =
                comVersao(currentUrl);

        }


        /* =========================================================
           ABRIR EM NOVA ABA
        ========================================================== */

        function openNewTab() {

            if (!currentUrl) {
                return;
            }


            window.open(
                currentUrl,
                "_blank",
                "noopener,noreferrer"
            );

        }


        /* =========================================================
           SIDEBAR MOBILE
        ========================================================== */

        function toggleSidebar() {

            const sidebar =
                document.getElementById("sidebar");

            const overlay =
                document.getElementById("sidebarOverlay");


            sidebar.classList.toggle("mobile-open");

            overlay.classList.toggle(
                "active"
            );

        }


        /* =========================================================
           FECHAR SIDEBAR MOBILE
        ========================================================== */

        function closeMobileSidebar() {

            const sidebar =
                document.getElementById("sidebar");

            const overlay =
                document.getElementById("sidebarOverlay");


            sidebar.classList.remove(
                "mobile-open"
            );

            overlay.classList.remove(
                "active"
            );

        }


        /* =========================================================
           FECHAR MENU AO CLICAR FORA
        ========================================================== */

        document.addEventListener(
            "click",
            function(event) {

                if (
                    window.innerWidth > 900
                ) {
                    return;
                }


                const sidebar =
                    document.getElementById(
                        "sidebar"
                    );

                const menuButton =
                    document.querySelector(
                        ".mobile-menu-button"
                    );


                if (
                    sidebar.classList.contains(
                        "mobile-open"
                    ) &&
                    !sidebar.contains(event.target) &&
                    !menuButton.contains(event.target)
                ) {

                    closeMobileSidebar();

                }

            }
        );


    </script>


</body>

</html>
